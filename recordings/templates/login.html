<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>ورود</title>
  <style>
    body { font-family: Tahoma, sans-serif; max-width: 420px; margin: 24px auto; padding: 0 12px; }
    input, button { margin: 4px 0; padding: 6px; }
    .err { color: #c00; }
  </style>
</head>
<body>
  <h3>ورود با ایمیل</h3>
  <input id="email" type="email" placeholder="you@example.com" style="direction:ltr">
  <button onclick="reqOtp()">ارسال کد</button><br>
  <input id="code" placeholder="کد ۶ رقمی" style="direction:ltr">
  <button onclick="verify()">ورود</button>
  <div id="msg"></div>

<script>
const msg = (t, err) => document.getElementById("msg").innerHTML =
  `<span class="${err ? "err" : ""}">${t}</span>`;
const post = (url, body) => fetch(url, {
  method: "POST",
  headers: {"Content-Type": "application/json"},
  body: JSON.stringify(body)
});

async function reqOtp() {
  const r = await post("/api/auth/email/request-otp/", {email: email.value});
  const d = await r.json();
  msg(d.detail || JSON.stringify(d), !r.ok);
}

async function verify() {
  const r = await post("/api/auth/email/verify-otp/", {email: email.value, code: code.value});
  const d = await r.json();
  if (!r.ok) return msg(d.detail || JSON.stringify(d), true);
  localStorage.setItem("access", d.access);
  localStorage.setItem("refresh", d.refresh);
  location.href = "/listen/";
}
</script>
</body>
</html>
