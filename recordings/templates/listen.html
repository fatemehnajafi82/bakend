<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>شنیدن صدا</title>
  <style>
    body { font-family: Tahoma, sans-serif; max-width: 520px; margin: 24px auto; padding: 0 12px; }
    input, button { margin: 4px 0; padding: 6px; }
    li { margin: 8px 0; }
    .err { color: #c00; }
  </style>
</head>
<body>
  <h3>آپلود ضبط</h3>
  <input type="file" id="file" accept="audio/*"><br>
  <input id="bpm" type="number" placeholder="bpm" value="118">
  <button onclick="upload()">آپلود</button>
  <div id="msg"></div>

  <h3>ضبط‌های اخیر</h3>
  <ul id="list"></ul>
  <audio id="player" controls style="width:100%"></audio>
  <p><a href="#" onclick="logout()">خروج</a></p>

<script>
const msg = (t, err) => document.getElementById("msg").innerHTML =
  `<span class="${err ? "err" : ""}">${t}</span>`;

// اگر توکن نبود به صفحهٔ ورود برگرد
if (!localStorage.getItem("access")) location.href = "/login/";

// درخواست با توکن؛ اگر access منقضی شد با refresh تازه‌اش می‌کند
async function api(url, opts = {}) {
  const send = () => fetch(url, {
    ...opts,
    headers: {...(opts.headers || {}), Authorization: "Bearer " + localStorage.getItem("access")}
  });
  let r = await send();
  if (r.status === 401) {
    const rr = await fetch("/api/auth/refresh/", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({refresh: localStorage.getItem("refresh")})
    });
    if (!rr.ok) { logout(); return r; }
    const d = await rr.json();
    localStorage.setItem("access", d.access);
    if (d.refresh) localStorage.setItem("refresh", d.refresh);
    r = await send();
  }
  return r;
}

async function loadList() {
  const r = await api("/api/recordings/?limit=3");
  if (!r.ok) return msg("خطا در دریافت لیست: " + r.status, true);
  const d = await r.json();
  list.innerHTML = "";
  d.results.forEach(rec => {
    const li = document.createElement("li");
    li.textContent = `#${rec.id} · ${rec.bpm ?? "-"} bpm · ${rec.duration}s `;
    const b = document.createElement("button");
    b.textContent = "▶ پخش";
    b.onclick = () => play(rec.audio_url);
    li.appendChild(b);
    list.appendChild(li);
  });
}

async function upload() {
  const f = file.files[0];
  if (!f) return msg("فایل انتخاب کن", true);
  const fd = new FormData();
  fd.append("audio", f);
  if (bpm.value) fd.append("bpm", bpm.value);
  const r = await api("/api/recordings/", {method: "POST", body: fd});
  msg(JSON.stringify(await r.json()), !r.ok);
  if (r.ok) loadList();
}

async function play(url) {
  const r = await api(url);
  if (!r.ok) return msg("خطا در دریافت فایل: " + r.status, true);
  player.src = URL.createObjectURL(await r.blob());
  player.play();
}

function logout() {
  localStorage.clear();
  location.href = "/login/";
}

loadList();
</script>
</body>
</html>
